name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - claude/chinese-english-translation-app-0vX45
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Push Worker secrets (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          set -e
          printf '%s' "$OPENAI_API_KEY"  | npx wrangler secret put OPENAI_API_KEY
          printf '%s' "$SITE_PASSWORD"   | npx wrangler secret put SITE_PASSWORD

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
