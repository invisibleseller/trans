<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时同传 · 单机版</title>
<style>
:root {
  --bg: #0d1117; --bg-elev: #161b22;
  --fg: #e6edf3; --fg-dim: #7d8590;
  --accent: #58a6ff; --ok: #3fb950; --err: #f85149;
  --border: #30363d; --interim: #7d8590;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", sans-serif;
  display: flex; flex-direction: column;
}
header {
  padding: 0.8rem 1.2rem;
  border-bottom: 1px solid var(--border);
  display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
  background: var(--bg-elev);
}
h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
.lang-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.88rem; color: var(--fg-dim); }
select, input[type=password] {
  background: var(--bg); color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 6px; padding: 0.35rem 0.6rem; font: inherit;
}
button {
  background: var(--accent); color: white; border: none;
  padding: 0.5rem 1.1rem; border-radius: 6px; cursor: pointer;
  font: inherit; font-weight: 600;
}
button:disabled { opacity: 0.6; cursor: wait; }
button.recording { background: var(--err); }
.status { font-size: 0.82rem; color: var(--fg-dim); }
.status.live { color: var(--ok); }
.status.err { color: var(--err); }

main {
  flex: 1; display: grid; grid-template-columns: 1fr 1fr;
  gap: 1px; background: var(--border); overflow: hidden;
}
@media (max-width: 700px) {
  main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
}
.pane { background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
.pane h2 {
  font-size: 0.78rem; color: var(--fg-dim); margin: 0;
  padding: 0.55rem 1rem; border-bottom: 1px solid var(--border);
  text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;
}
.pane .lines { flex: 1; overflow-y: auto; padding: 1rem 1.2rem; }
.line { margin-bottom: 0.9rem; line-height: 1.55; font-size: 1.2rem; }
.pane.source .line { color: var(--fg); }
.pane.translation .line { color: var(--accent); }
.line.interim { color: var(--interim); }
.pane.translation .line.interim { color: #6f8bd9; opacity: 0.75; }

footer {
  padding: 0.45rem 1.2rem; font-size: 0.74rem; color: var(--fg-dim);
  border-top: 1px solid var(--border);
}

#keyOverlay {
  position: fixed; inset: 0; background: rgba(13,17,23,0.96);
  display: flex; align-items: center; justify-content: center; z-index: 10;
}
#keyOverlay .card {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 12px; padding: 1.6rem; width: min(420px, 92vw);
}
#keyOverlay h2 { margin: 0 0 0.4rem; font-size: 1.2rem; }
#keyOverlay p { margin: 0 0 1rem; color: var(--fg-dim); font-size: 0.86rem; }
#keyOverlay input { width: 100%; }
#keyOverlay button { margin-top: 0.9rem; width: 100%; }
</style>
</head>
<body>

<!-- One-time key prompt. Skipped if a key is hardcoded above the script. -->
<div id="keyOverlay" hidden>
  <form class="card" id="keyForm">
    <h2>粘贴 OpenAI API Key</h2>
    <p>只存在本浏览器（localStorage），不上传到任何地方。要清掉就清浏览器数据。</p>
    <input id="keyInput" type="password" placeholder="sk-..." required autofocus autocomplete="off">
    <button type="submit">保存</button>
  </form>
</div>

<header>
  <h1>实时同传 · 单机版</h1>
  <div class="lang-row">
    <span>我说</span>
    <select id="srcLang">
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="de">Deutsch</option>
      <option value="ru">Русский</option>
      <option value="fr">Français</option>
    </select>
    <span>→ 译为</span>
    <select id="tgtLang">
      <option value="en">English</option>
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="de">Deutsch</option>
      <option value="ru">Русский</option>
      <option value="fr">Français</option>
    </select>
  </div>
  <button id="micBtn">开始说话</button>
  <span id="status" class="status">未开始</span>
</header>

<main>
  <section class="pane source">
    <h2>原文（我说的）</h2>
    <div id="sourceLines" class="lines"></div>
  </section>
  <section class="pane translation">
    <h2>译文（同步发出）</h2>
    <div id="translationLines" class="lines"></div>
  </section>
</main>

<footer>
  浏览器通过 WebRTC 直连 <code>api.openai.com</code>。无服务器、无信令。如果遇到 CORS 错误，把文件放在一个文件夹里运行 <code>python3 -m http.server 8000</code>，访问 <code>http://localhost:8000/tongchuan.html</code> 即可。
</footer>

<script>
const MODEL = "gpt-4o-realtime-preview";
const KEY_STORAGE = "tc_oai_key";

let OPENAI_API_KEY = "__OPENAI_API_KEY__";
if (!OPENAI_API_KEY || OPENAI_API_KEY.startsWith("__")) {
  OPENAI_API_KEY = localStorage.getItem(KEY_STORAGE) || "";
}
if (!OPENAI_API_KEY) {
  document.getElementById("keyOverlay").hidden = false;
}
document.getElementById("keyForm").onsubmit = (e) => {
  e.preventDefault();
  const v = document.getElementById("keyInput").value.trim();
  if (!v) return;
  localStorage.setItem(KEY_STORAGE, v);
  OPENAI_API_KEY = v;
  document.getElementById("keyOverlay").hidden = true;
};

const LANG_NAMES = {
  zh: { name: '中文',     english: 'Chinese',  whisper: 'zh' },
  en: { name: 'English',  english: 'English',  whisper: 'en' },
  ja: { name: '日本語',   english: 'Japanese', whisper: 'ja' },
  de: { name: 'Deutsch',  english: 'German',   whisper: 'de' },
  ru: { name: 'Русский',  english: 'Russian',  whisper: 'ru' },
  fr: { name: 'Français', english: 'French',   whisper: 'fr' },
};

const $ = (id) => document.getElementById(id);
let pc = null, dc = null, micStream = null, active = false;
const sourceBlocks = new Map();
const translationBlocks = new Map();
const responseToItem = new Map();
let lastUserItemId = null;

$('micBtn').onclick = async () => {
  if (active) { stop(); return; }
  if (!OPENAI_API_KEY) { $('keyOverlay').hidden = false; return; }
  try { await start(); }
  catch (e) {
    console.error(e);
    setStatus('错误：' + (e.message || e), 'err');
    stop();
  }
};

function setStatus(text, cls = '') {
  const el = $('status');
  el.textContent = text;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

function buildSessionUpdate() {
  const src = LANG_NAMES[$('srcLang').value];
  const tgt = LANG_NAMES[$('tgtLang').value];
  return {
    type: 'session.update',
    session: {
      modalities: ['text'],
      instructions:
        `You are a professional simultaneous interpreter. ` +
        `The user speaks ${src.english}. ` +
        `Translate every utterance into natural, idiomatic ${tgt.english}. ` +
        `Output ONLY the ${tgt.english} translation — no explanations, no source text, no labels. ` +
        `Preserve tone. Begin emitting as soon as enough has been said; do not wait for the full sentence. ` +
        `Keep proper nouns and well-known technical terms in their conventional form.`,
      input_audio_transcription: { model: 'whisper-1', language: src.whisper },
      turn_detection: {
        type: 'server_vad',
        threshold: 0.5,
        prefix_padding_ms: 300,
        silence_duration_ms: 600,
        create_response: true,
      },
      temperature: 0.6,
    },
  };
}

async function start() {
  setStatus('请求麦克风…');
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
  });

  setStatus('建立连接…');
  pc = new RTCPeerConnection();
  pc.addEventListener('connectionstatechange', () => {
    if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
      setStatus('连接断开', 'err');
      stop();
    }
  });

  // OpenAI Realtime sends model audio over a track too; we don't need it (modalities=text).
  pc.addEventListener('track', () => {});

  micStream.getTracks().forEach((t) => pc.addTrack(t, micStream));

  dc = pc.createDataChannel('oai-events');
  dc.addEventListener('open', () => {
    dc.send(JSON.stringify(buildSessionUpdate()));
    setStatus('正在聆听', 'live');
  });
  dc.addEventListener('message', (e) => {
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    handleEvent(ev);
  });

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  const resp = await fetch(`https://api.openai.com/v1/realtime?model=${encodeURIComponent(MODEL)}`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${OPENAI_API_KEY}`,
      'Content-Type': 'application/sdp',
    },
    body: offer.sdp,
  });

  if (!resp.ok) {
    const text = await resp.text();
    throw new Error(`OpenAI ${resp.status}: ${text.slice(0, 200)}`);
  }

  const answerSdp = await resp.text();
  await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });

  active = true;
  $('micBtn').textContent = '停止';
  $('micBtn').classList.add('recording');
}

function stop() {
  const wasActive = active;
  active = false;
  try { dc && dc.close(); } catch {}
  try { pc && pc.close(); } catch {}
  if (micStream) micStream.getTracks().forEach((t) => t.stop());
  pc = dc = micStream = null;
  $('micBtn').textContent = '开始说话';
  $('micBtn').classList.remove('recording');
  if (wasActive) setStatus('已停止', '');
}

$('srcLang').addEventListener('change', () => {
  if (dc && dc.readyState === 'open') dc.send(JSON.stringify(buildSessionUpdate()));
});
$('tgtLang').addEventListener('change', () => {
  if (dc && dc.readyState === 'open') dc.send(JSON.stringify(buildSessionUpdate()));
});

function handleEvent(ev) {
  switch (ev.type) {
    case 'conversation.item.created':
      if (ev.item && ev.item.role === 'user') {
        lastUserItemId = ev.item.id;
        ensureSourceBlock(ev.item.id);
      }
      break;
    case 'conversation.item.input_audio_transcription.delta':
      updateSource(ev.item_id, ev.delta || '', false, true);
      break;
    case 'conversation.item.input_audio_transcription.completed':
      updateSource(ev.item_id, ev.transcript || '', true, false);
      break;
    case 'response.created':
      if (ev.response?.id && lastUserItemId) {
        responseToItem.set(ev.response.id, lastUserItemId);
      }
      break;
    case 'response.text.delta':
      updateTranslation(ev.response_id, ev.delta || '', false, true);
      break;
    case 'response.text.done':
      updateTranslation(ev.response_id, ev.text || '', true, false);
      break;
    case 'response.done':
      if (ev.response && ev.response.output) {
        const text = ev.response.output
          .flatMap((o) => o.content || [])
          .map((c) => c.text || c.transcript || '')
          .join('');
        if (text) updateTranslation(ev.response.id, text, true, false);
      }
      break;
    case 'error':
      console.error('Realtime error', ev);
      setStatus('错误: ' + (ev.error?.message || 'unknown'), 'err');
      break;
  }
}

function ensureSourceBlock(itemId) {
  let blk = sourceBlocks.get(itemId);
  if (blk) return blk;
  const el = document.createElement('div');
  el.className = 'line interim';
  el.textContent = '…';
  $('sourceLines').appendChild(el);
  blk = { el, text: '', done: false };
  sourceBlocks.set(itemId, blk);
  scrollBottom($('sourceLines'));
  return blk;
}
function updateSource(itemId, payload, done, append) {
  const blk = ensureSourceBlock(itemId);
  if (done) { blk.text = payload; blk.done = true; blk.el.classList.remove('interim'); }
  else { if (append) blk.text += payload; else blk.text = payload; }
  blk.el.textContent = blk.text || '…';
  scrollBottom($('sourceLines'));
}
function ensureTranslationBlock(responseId) {
  let blk = translationBlocks.get(responseId);
  if (blk) return blk;
  const el = document.createElement('div');
  el.className = 'line interim';
  $('translationLines').appendChild(el);
  blk = { el, text: '', done: false };
  translationBlocks.set(responseId, blk);
  scrollBottom($('translationLines'));
  return blk;
}
function updateTranslation(responseId, payload, done, append) {
  const blk = ensureTranslationBlock(responseId);
  if (done) {
    if (payload && payload.length > blk.text.length) blk.text = payload;
    blk.done = true;
    blk.el.classList.remove('interim');
  } else {
    if (append) blk.text += payload; else blk.text = payload;
  }
  blk.el.textContent = blk.text;
  scrollBottom($('translationLines'));
}
function scrollBottom(el) { el.scrollTop = el.scrollHeight; }

window.addEventListener('beforeunload', () => { stop(); });
</script>

</body>
</html>
