name = "realtime-interp"
main = "src/index.js"
compatibility_date = "2025-04-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# D1 database — disabled for the invite-only mode (no accounts / no codes).
# Re-enable later when turning paid features back on:
#   npx wrangler d1 create realtime-interp-db
#   npx wrangler d1 execute realtime-interp-db --remote --file=./migrations/0001_init.sql
# [[d1_databases]]
# binding = "DB"
# database_name = "realtime-interp-db"
# database_id = "..."

[vars]
MODEL = "gpt-4o-realtime-preview"
TRIAL_SECONDS = "60"

# Required secrets (Cloudflare dashboard → Settings → Variables, or):
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put SITE_PASSWORD  ← shared gate password. Tell each
#                                            invited user this one string;
#                                            without it the app is unreachable.
#
# Optional secrets — when set, these features light up:
#   RESEND_API_KEY      enables real email sending for magic links
#   EMAIL_FROM          [vars] addr; must be a domain verified in Resend
#   GOOGLE_CLIENT_ID    enables Google sign-in
#   GOOGLE_CLIENT_SECRET
#   WECHAT_APP_ID       enables WeChat 扫码 sign-in (also needs 开放平台 资质)
#   WECHAT_APP_SECRET
#   PUBLIC_ORIGIN       optional, e.g. https://talk.example.com (otherwise
#                       derived from request URL)
