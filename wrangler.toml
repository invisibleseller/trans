name = "realtime-interp"
main = "src/index.js"
compatibility_date = "2025-04-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Non-secret config. Override in dashboard or via wrangler.
[vars]
MODEL = "gpt-4o-realtime-preview"
TRIAL_SECONDS = "30"

# Required secret (set with `wrangler secret put OPENAI_API_KEY`):
#   OPENAI_API_KEY = sk-...
