<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时同传对话</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ HOME ============ -->
<section id="view-home" class="view active">
  <div class="card">
    <h1>实时同传对话</h1>
    <p class="lede">两人各说各的语言，对方实时看见自己语言的字幕。免费试用每人 30 秒语音。</p>
    <div class="home-actions">
      <button class="btn primary big" id="goCreate">创建房间</button>
      <button class="btn big" id="goJoin">加入房间</button>
    </div>
    <p class="footer-hint">基于 OpenAI Realtime。房间号 12 小时后自动失效。</p>
  </div>
</section>

<!-- ============ CREATE ============ -->
<section id="view-create" class="view">
  <div class="card">
    <a href="#" class="back" data-back>← 返回</a>
    <h1>创建房间</h1>
    <p class="lede">分享房间号给对方即可开始。</p>
    <form id="createForm">
      <label>
        我的语言（你说的语言）
        <select id="createLang"></select>
      </label>
      <label>
        房间密码（可选）
        <input id="createPwd" type="text" autocomplete="off" placeholder="留空则无密码">
      </label>
      <div class="form-actions">
        <button class="btn primary" type="submit" id="createBtn">创建并进入</button>
      </div>
      <p id="createErr" class="err" hidden></p>
    </form>
  </div>
</section>

<!-- ============ JOIN ============ -->
<section id="view-join" class="view">
  <div class="card">
    <a href="#" class="back" data-back>← 返回</a>
    <h1>加入房间</h1>
    <form id="joinForm">
      <label>
        房间号
        <input id="joinRoom" type="text" autocomplete="off" placeholder="例如 A7K3M2" required maxlength="12">
      </label>
      <label>
        我的语言（你说的语言）
        <select id="joinLang"></select>
      </label>
      <label>
        房间密码
        <input id="joinPwd" type="text" autocomplete="off" placeholder="若房间无密码则留空">
      </label>
      <div class="form-actions">
        <button class="btn primary" type="submit" id="joinBtn">加入</button>
      </div>
      <p id="joinErr" class="err" hidden></p>
    </form>
  </div>
</section>

<!-- ============ ROOM ============ -->
<section id="view-room" class="view room">
  <header class="room-bar">
    <div class="room-id">
      房间 <span id="roomCode">—</span>
      <button id="copyRoom" class="btn icon" title="复制房间号">⧉</button>
    </div>
    <div class="lang-bar">
      <label class="lang-group">
        <span>我说</span>
        <select id="myLang"></select>
      </label>
      <span class="arrow">↔</span>
      <span class="peer-lang" id="peerLangLabel">对方未到</span>
    </div>
    <div class="controls">
      <span id="quota" class="quota" title="试用语音输入余额">—</span>
      <span id="status" class="status">连接中…</span>
      <button id="micBtn" class="btn primary">开始说话</button>
      <button id="leaveBtn" class="btn">离开</button>
    </div>
  </header>

  <main class="room-main">
    <section class="pane primary-pane">
      <header class="pane-head">对方说的（我的语言）</header>
      <div id="incoming" class="lines big-lines" aria-live="polite"></div>
    </section>
    <section class="pane secondary-pane">
      <header class="pane-head">我说的（识别 / 已发送译文）</header>
      <div id="outgoing" class="lines" aria-live="polite"></div>
    </section>
  </main>
</section>

<script src="app.js"></script>
</body>
</html>
